<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hạng Thị Kim Trang - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Nền cầu vồng chuyển động đầy đủ màu sắc tươi sáng */
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ffecd2, #fcb69f, #ffecd2, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1, #a1c4fd, #c2e9fb, #fbc2eb, #a18cd1);
            background-size: 500% 500%;
            animation: fullRainbowBg 12s ease infinite;
            color: #2b2b2b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes fullRainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Khung Embed chính (Sáng, kính mờ sang trọng) */
        .embed-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 0 25px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Viền cầu vồng chạy ở đầu khung */
        .embed-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rainbowBorder 5s linear infinite;
        }

        @keyframes rainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Phần thông tin đầu khung */
        .embed-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .embed-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid transparent;
            background-image: linear-gradient(#ffffff, #ffffff), linear-gradient(135deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #333333;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .embed-meta {
            flex-grow: 1;
        }

        .embed-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666666;
            margin-bottom: 4px;
        }

        .embed-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff416c, #ff4b2b, #f7b733, #56ab2f, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Danh sách nút Embed */
        .embed-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .embed-btn {
            background-color: rgba(240, 244, 248, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #2b2b2b;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .embed-btn:hover {
            background-color: #ffffff;
            border-color: #ff416c;
            transform: translateX(4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .embed-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-content svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-arrow {
            color: #666666;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .embed-btn:hover .btn-arrow {
            color: #ff416c;
        }

        /* Chân khung Embed */
        .embed-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #666666;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(40, 167, 69, 0.6);
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="embed-card">

        <div class="embed-footer">

        </div>
    </div>

    <script>
        function copyText(text, element) {
            navigator.clipboard.writeText(text);
            const textSpan = element.querySelector('.btn-text');
            const originalText = textSpan.innerText;
            
            textSpan.innerText = "✓ Đã Sao Chép!";
            element.style.borderColor = "#ff416c";
            
            setTimeout(() => {
                textSpan.innerText = originalText;
                element.style.borderColor = "rgba(0, 0, 0, 0.06)";
            }, 1500);
        }
    </script>
</body>
  </html>
