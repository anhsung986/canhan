<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Video - Anh Sùng</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #070514 0%, #160a2a 100%); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .glass-card { background: rgba(20, 15, 35, 0.5); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255, 0, 127, 0.2); padding: 30px; width: 100%; max-width: 420px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; margin-bottom: 15px; color: #ff007f; }
        .video-box { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 20px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .btn-back { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 12px; text-decoration: none; color: #fff; font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); transition: 0.3s; }
        .btn-back:hover { background: rgba(255, 0, 127, 0.2); border-color: #ff007f; color: #ff007f; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>DANH SÁCH VIDEO</h1>
        
        <div class="video-box">
            <!-- Thay ID video Youtube tại đây -->
            <iframe src="https://vt.tiktok.com/ZSqv7SB9V/" allowfullscreen></iframe>
        </div>

        <!-- Chỉ quay về trang cá nhân cn/sta.html -->
        <a href="../sta.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Quay lại Trang Cá Nhân
        </a>
    </div>
</body>
</html>
