<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hà'z My'z - Profile Embed</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Khung Embed chính với viền & bóng màu #016844 */
        .embed-card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(145deg, #091310, #050a08);
            border: 1px solid #016844;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(1, 104, 68, 0.25), 0 0 0 1px rgba(1, 104, 68, 0.2) inset;
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng ánh sáng màu #016844 góc trên */
        .embed-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #016844, #33a876, #016844, transparent);
        }

        /* Phần thông tin đầu khung */
        .embed-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(1, 104, 68, 0.3);
        }

        .embed-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(1, 104, 68, 0.15);
            border: 2px solid #016844;
            color: #33a876;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(1, 104, 68, 0.4);
        }

        .embed-meta {
            flex-grow: 1;
        }

        .embed-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #33a876;
            margin-bottom: 4px;
        }

        .embed-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* Danh sách nút Embed dạng thanh ngang */
        .embed-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .embed-btn {
            background-color: rgba(1, 104, 68, 0.1);
            border: 1px solid rgba(1, 104, 68, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .embed-btn:hover {
            background-color: #016844;
            border-color: #33a876;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(1, 104, 68, 0.4);
        }

        .embed-btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-content svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-arrow {
            color: #33a876;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .embed-btn:hover .btn-arrow {
            color: #ffffff;
        }

        /* Chân khung Embed */
        .embed-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #33a876;
            padding-top: 12px;
            border-top: 1px solid rgba(1, 104, 68, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #33a876;
            border-radius: 50%;
            box-shadow: 0 0 8px #33a876;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div class="embed-card">
        <!-- Header Profile -->
        <div class="embed-header">
            <div class="embed-avatar">LTH</div>
            <div class="embed-meta">
                <div class="embed-tag">Verified Profile</div>
                <h1 class="embed-name">Hà'z My'z</h1>
            </div>
        </div>

        <!-- Links Container -->
        <div class="embed-links">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@th.duyen012" target="_blank" class="embed-btn">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.6a6.34 6.34 0 0 0 10.86 4.43v-7.8a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.06z"/></svg>
                    Kênh TikTok
                </div>
                <div class="btn-arrow">↗</div>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1D26Y1C4su/" target="_blank" class="embed-btn">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
                    Facebook Cá Nhân
                </div>
                <div class="btn-arrow">↗</div>
            </a>

            <!-- YouTube (Chưa có) -->
            <a href="#" class="embed-btn disabled">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    Kênh YouTube (Chưa có)
                </div>
                <div class="btn-arrow">—</div>
            </a>

            <!-- Sao chép Email -->
            <div class="embed-btn" onclick="copyText('example@gmail.com', this)">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <span class="btn-text">Sao Chép Email</span>
                </div>
                <div class="btn-arrow">📋</div>
            </div>

            <!-- Danh Sách Game -->
            <a href="#game" onclick="alert('Danh sách game đang cập nhật!')" class="embed-btn">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4M15 11h.01M18 13h.01"/></svg>
                    Danh Sách Game
                </div>
                <div class="btn-arrow">↗</div>
            </a>

            <!-- Số tài khoản -->
            <div class="embed-btn" onclick="copyText('1234567890', this)">
                <div class="btn-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                    <span class="btn-text">Số Tài Khoản</span>
                </div>
                <div class="btn-arrow">📋</div>
            </div>
        </div>

        <!-- Footer Embed -->
        <div class="embed-footer">
            <span><span class="status-dot"></span>Online</span>
            <span>© 2026 Hà'z My'z</span>
        </div>
    </div>

    <script>
        function copyText(text, element) {
            navigator.clipboard.writeText(text);
            const textSpan = element.querySelector('.btn-text');
            const originalText = textSpan.innerText;
            
            textSpan.innerText = "✓ Đã Sao Chép!";
            element.style.borderColor = "#33a876";
            
            setTimeout(() => {
                textSpan.innerText = originalText;
                element.style.borderColor = "rgba(1, 104, 68, 0.3)";
            }, 1500);
        }
    </script>
</body>
  </html>
