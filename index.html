<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - ANH SÙNG</title>
    <!-- Nhúng Font Awesome để sử dụng các biểu tượng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Đặt lại kiểu mặc định cho trang */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #0a0514; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Khung chứa giao diện điện thoại */
        .phone-frame { width: 360px; background: #130c21; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }

        /* Thanh tiêu đề trên cùng */
        .header-top { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .icon-btn { background: #1e1531; color: #888; border: none; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* Khu vực hồ sơ */
        .profile-section { text-align: center; margin-bottom: 40px; }
        .avatar-container { position: relative; width: 100px; height: 100px; margin: 0 auto 15px auto; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #ff00ff; }
        .avatar-ring { position: absolute; top: -5px; left: -5px; width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#ff00ff, #00ffff, #ff00ff); animation: rotate 4s linear infinite; }
        .profile-name { font-size: 1.5rem; font-weight: bold; color: #ff007f; text-transform: uppercase; }

        /* Danh sách các liên kết */
        .link-list { display: flex; flex-direction: column; gap: 15px; }
        .link-item { display: flex; align-items: center; justify-content: space-between; background: #1e1531; padding: 15px 20px; border-radius: 10px; text-decoration: none; color: white; transition: background 0.2s; }
        .link-item:hover { background: #2a1f45; }
        .link-left { display: flex; align-items: center; gap: 15px; }
        .link-icon { color: #ccc; font-size: 1.2rem; width: 25px; text-align: center;}
        .link-text { font-size: 1rem; }
        .link-arrow { color: #888; font-size: 0.9rem; }

        /* Liên kết tài khoản (đặc biệt) */
        .account-item { border: 2px solid #00ffff; color: #00ffff; background: transparent; }
        .account-item:hover { background: rgba(0, 255, 255, 0.1); }
        .account-item .link-icon, .account-item .link-text { color: #00ffff; }
        .account-item .link-arrow { color: #00ffff; font-size: 1.1rem; }

        /* Chân trang */
        .footer { text-align: center; color: #666; font-size: 0.8rem; margin-top: 30px; }

        /* Hiệu ứng xoay viền */
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Thanh điều hướng trên -->
    <div class="header-top">
        <button class="icon-btn"><i class="fas fa-bars"></i></button>
        <div style="display: flex; gap: 10px;">
            <button class="icon-btn"><i class="far fa-eye-slash"></i></button>
            <button class="icon-btn"><i class="fas fa-share-alt"></i></button>
        </div>
    </div>

    <!-- Thông tin cá nhân -->
    <div class="profile-section">
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <img src="image/mau1.png" alt="Ảnh đại diện" class="avatar">
        </div>
        <div class="profile-name">ANH SÙNG</div>
    </div>

    <!-- Danh sách các liên kết -->
    <div class="link-list">
        <!-- Discord -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fab fa-discord link-icon"></i>
                <span class="link-text">Discord</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- Kênh TikTok -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fab fa-tiktok link-icon"></i>
                <span class="link-text">Kênh TikTok</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- Facebook Cá Nhân -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fab fa-facebook link-icon"></i>
                <span class="link-text">Facebook Cá Nhân</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- Kênh YouTube -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fab fa-youtube link-icon"></i>
                <span class="link-text">Kênh YouTube</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- Danh Sách Email -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fas fa-envelope link-icon"></i>
                <span class="link-text">Danh Sách Email</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- Danh Sách Game -->
        <a href="#" class="link-item">
            <div class="link-left">
                <i class="fas fa-gamepad link-icon"></i>
                <span class="link-text">Danh Sách Game</span>
            </div>
            <i class="fas fa-chevron-right link-arrow"></i>
        </a>

        <!-- SỐ tài khoản (Đặc biệt) -->
        <a href="#" class="link-item account-item">
            <div class="link-left">
                <i class="fas fa-wallet link-icon"></i>
                <span class="link-text">SỐ tài khoản</span>
            </div>
            <i class="far fa-copy link-arrow"></i>
        </a>
    </div>

    <!-- Chân trang -->
    <div class="footer">
        POWERED BY ANH SÙNG • © 2026
    </div>
</div>

</body>
</html>
