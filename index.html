<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Gian Cá Nhân</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; color: #ffffff; padding: 20px;
        }
        .dashboard {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 50px 40px;
            width: 100%; max-width: 900px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; font-weight: 300; color: rgba(255, 255, 255, 0.85); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; }
        
        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 30px 20px; text-align: center; text-decoration: none;
            color: #ffffff; transition: all 0.4s ease; display: flex; flex-direction: column;
            align-items: center; position: relative; overflow: hidden; cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px); background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .icon { font-size: 3.5rem; margin-bottom: 15px; transition: transform 0.3s ease; }
        .card:hover .icon { transform: scale(1.1); }
        .title { font-size: 1.2rem; font-weight: 400; word-break: break-word; }
        #loading { text-align: center; font-size: 1.2rem; width: 100%; grid-column: 1 / -1; }
        .error { color: #ff6b6b; text-align: center; width: 100%; grid-column: 1 / -1; }

        /* Giao diện khung Embed Loading */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 16px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #fff;
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal p { font-size: 1.2rem; font-weight: 400; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Trang Chủ Cá Nhân</h1>
            <p>Tự động cập nhật tài liệu từ thư mục <strong>cn</strong> trên GitHub</p>
        </div>
        <div class="grid" id="file-grid">
            <div id="loading">⏳ Đang quét thư mục cn...</div>
        </div>
    </div>

    <!-- Khung Embed thông báo chờ -->
    <div id="overlay" class="overlay">
        <div class="modal">
            <div class="spinner"></div>
            <p>[ Đang kiểm tra thông tin... ]</p>
        </div>
    </div>

    <script>
        const githubUsername = 'anhsung986'; 
        const repoName = 'canhan';
        const folderPath = 'cn'; 

        const apiURL = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/${folderPath}`;

        async function fetchGitHubFiles() {
            const grid = document.getElementById('file-grid');
            
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Thư mục "cn" chưa tồn tại hoặc rỗng');
                
                const files = await response.json();
                grid.innerHTML = ''; 
                
                if(!Array.isArray(files) || files.length === 0) {
                    grid.innerHTML = '<div style="text-align:center; width:100%;">Thư mục cn hiện đang trống.</div>';
                    return;
                }
                
                files.forEach(file => {
                    let icon = '📄'; 
                    const fileName = file.name.toLowerCase();
                    
                    if (file.type === 'dir') icon = '📁';
                    else if(fileName.endsWith('.jpg') || fileName.endsWith('.png') || fileName.endsWith('.gif')) icon = '🖼️';
                    else if(fileName.endsWith('.pdf')) icon = '📕';
                    else if(fileName.endsWith('.xlsx') || fileName.endsWith('.csv')) icon = '📊';
                    else if(fileName.endsWith('.mp4')) icon = '🎬';
                    else if(fileName.endsWith('.html')) icon = '🌐';
                    
                    // Thêm sự kiện onclick gọi hàm xử lý chuyển trang
                    const card = `
                        <a onclick="handleFileClick('${file.name}')" class="card">
                            <span class="icon">${icon}</span>
                            <span class="title">${file.name}</span>
                        </a>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                grid.innerHTML = `<div class="error">Lỗi: ${error.message}.</div>`;
            }
        }

        // Hàm xử lý khi bấm vào thẻ file
        function handleFileClick(fileName) {
            const overlay = document.getElementById('overlay');
            const targetUrl = `https://st.canhan.gt.tc/cn/${fileName}`;
            
            // Hiển thị khung chờ
            overlay.classList.add('active');
            
            // Đợi 1.5 giây (1500ms) rồi chuyển hướng đến link mới
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1500); 
        }

        fetchGitHubFiles();
    </script>
</body>
</html>
