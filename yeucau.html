<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Yêu Cầu Thiết Kế Web - ST Canhan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        h2 { color: #007BFF; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        input[type="text"]:focus, textarea:focus { border-color: #007BFF; outline: none; }
        
        .btn { display: inline-block; background: #007BFF; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; text-align: center; text-decoration: none; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; margin-top: 10px; }
        .btn-success:hover { background: #218838; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }

        /* Khung hiển thị kết quả xem trước */
        .result-box { margin-top: 30px; padding: 20px; background: #e9ecef; border-left: 5px solid #007BFF; border-radius: 4px; display: none; }
        .result-box h3 { color: #2c3e50; margin-bottom: 15px; font-size: 1.2rem; }
        .result-box p { margin-bottom: 10px; color: #444; word-break: break-word; }
        .code-tag { display: inline-block; background: #007BFF; color: white; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 1.2rem; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập Yêu Cầu Thiết Kế Web</h2>
    
    <form id="requestForm">
        <div class="form-group">
            <label for="name">Họ và tên của bạn:</label>
            <input type="text" id="name" required placeholder="Nhập họ tên đầy đủ...">
        </div>

        <div class="form-group">
            <label for="content">Nội dung / Ý tưởng yêu cầu:</label>
            <textarea id="content" rows="5" required placeholder="Nhập chi tiết yêu cầu thiết kế web..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn">Gửi Yêu Cầu & Tạo Mã</button>
    </form>

    <!-- Khu vực hiển thị kết quả ngay sau khi bấm tạo -->
    <div class="result-box" id="resultArea">
        <h3>Tạo yêu cầu thành công!</h3>
        <p><strong>Mã đơn duy nhất của bạn:</strong></p>
        <div style="margin: 10px 0;"><span id="resCode" class="code-tag"></span></div>
        <p><strong>Họ tên:</strong> <span id="resName"></span></p>
        <p><strong>Nội dung:</strong> <span id="resContent"></span></p>
        
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- Nút hành động gửi thông tin -->
        <p style="font-size: 0.9rem; color: #555; margin-bottom: 10px;">
            Vui lòng lưu lại thông tin hoặc sao chép mã đơn này gửi cho Admin để tiến hành tạo web:
        </p>
        
        <button id="downloadBtn" class="btn btn-success">Tải về file ghi nhớ đơn hàng (.txt)</button>
    </div>

    <a href="index.html" class="back-link">&larr; Quay lại trang chủ</a>
</div>

<script>
    // Hàm tạo 1 mã ngẫu nhiên duy nhất 5 ký tự (chữ + số, không ký tự đặc biệt)
    function generateSingleCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 5; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    let globalCode = '';
    let globalName = '';
    let globalContent = '';

    document.getElementById('requestForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Chặn tải lại trang

        globalName = document.getElementById('name').value;
        globalContent = document.getElementById('content').value;
        globalCode = generateSingleCode(); // Tạo đúng 1 mã duy nhất

        // Đổ dữ liệu ra khung xem trước
        document.getElementById('resCode').innerText = globalCode;
        document.getElementById('resName').innerText = globalName;
        document.getElementById('resContent').innerText = globalContent;

        // Hiển thị khung kết quả và ẩn nút tạo để tránh bấm lại
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('submitBtn').style.display = 'none';

        // Cuộn màn hình xuống vùng kết quả
        document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
    });

    // Xử lý nút tải file ghi nhớ thông tin về máy
    document.getElementById('downloadBtn').addEventListener('click', function() {
        const fileData = `THÔNG TIN YÊU CẦU TẠO WEB CÁ NHÂN\n-----------------------------------\nMã đơn: ${globalCode}\nHọ và tên: ${globalName}\nNội dung yêu cầu: ${globalContent}\n`;
        
        const blob = new Blob([fileData], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `DonHang_${globalCode}.txt`;
        link.click();
    });
</script>

</body>
</html>
