<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Yêu Cầu Thiết Kế Web - ST Canhan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        h2 { color: #007BFF; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        input[type="text"]:focus, textarea:focus { border-color: #007BFF; outline: none; }
        
        .btn { display: inline-block; background: #007BFF; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; text-align: center; text-decoration: none; }
        .btn:hover { background: #0056b3; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }

        /* Khung hiển thị kết quả sau khi gửi */
        .result-box { margin-top: 30px; padding: 20px; background: #e9ecef; border-left: 5px solid #007BFF; border-radius: 4px; display: none; }
        .result-box h3 { color: #2c3e50; margin-bottom: 15px; font-size: 1.2rem; }
        .result-box p { margin-bottom: 10px; color: #444; word-break: break-word; }
        .code-tag { display: inline-block; background: #007BFF; color: white; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-family: monospace; font-size: 1.2rem; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập Yêu Cầu Thiết Kế Web Cá Nhân</h2>
    
    <!-- Bỏ action và method cũ đi, dùng JavaScript xử lý gửi ngầm -->
    <form id="requestForm">
        
        <!-- Trường ẩn chứa mã đơn tự động -->
        <input type="hidden" name="MaDon" id="hiddenCode">

        <div class="form-group">
            <label for="name">Họ và tên của bạn:</label>
            <input type="text" name="HoTen" id="name" required placeholder="Nhập họ tên đầy đủ..." autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
        </div>

        <div class="form-group">
            <label for="content">Nội dung / Ý tưởng yêu cầu:</label>
            <textarea name="NoiDung" id="content" rows="5" required placeholder="Nhập chi tiết yêu cầu thiết kế web..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn">Gửi Yêu Cầu & Tạo Mã</button>
    </form>

    <!-- Khu vực hiển thị thông tin ngay sau khi bấm gửi -->
    <div class="result-box" id="resultArea">
        <h3>Gửi yêu cầu thành công!</h3>
        <p>Thông tin đã được gửi về hệ thống Email của quản trị viên.</p>
        <p><strong>Mã đơn duy nhất của bạn:</strong></p>
        <div style="margin: 10px 0;"><span id="resCode" class="code-tag"></span></div>
        <p><strong>Họ tên:</strong> <span id="resName"></span></p>
        <p><strong>Nội dung:</strong> <span id="resContent"></span></p>
        <p style="margin-top: 15px; font-size: 0.85rem; color: #666; font-style: italic;">* Vui lòng nhớ mã đơn này để làm mã định danh cho trang web của bạn.</p>
    </div>

    <a href="index.html" class="back-link">&larr; Quay lại trang chủ</a>
</div>

<script>
    // Hàm tạo 1 mã ngẫu nhiên duy nhất 5 ký tự
    function generateSingleCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 5; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    const uniqueCode = generateSingleCode();
    document.getElementById('hiddenCode').value = uniqueCode;

    document.getElementById('requestForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Chặn hành động chuyển trang mặc định của form

        const name = document.getElementById('name').value;
        const content = document.getElementById('content').value;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.innerText = "Đang gửi...";
        submitBtn.disabled = true;

        // Đóng gói dữ liệu form để gửi ngầm tới Formspree
        const formData = new FormData(this);

        fetch("https://formspree.io/f/xvkooody", {
            method: "POST",
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        }).then(response => {
            // Hiển thị thông tin và mã đơn ngay lập tức trên trang hiện tại
            document.getElementById('resCode').innerText = uniqueCode;
            document.getElementById('resName').innerText = name;
            document.getElementById('resContent').innerText = content;

            document.getElementById('requestForm').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
        }).catch(error => {
            alert("Có lỗi xảy ra khi gửi, vui lòng thử lại!");
            submitBtn.innerText = "Gửi Yêu Cầu & Tạo Mã";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
